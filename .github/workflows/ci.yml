name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          BETTER_AUTH_SECRET: ci-secret-min-32-chars-long-here
          BETTER_AUTH_URL: http://localhost:3000
          FINNHUB_API_KEY: ci-placeholder

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r ai-service/requirements.txt
      - run: pytest ai-service/tests -q
        working-directory: ai-service
        env:
          PYTHONPATH: .
